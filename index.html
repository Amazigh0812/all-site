<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>verbe allemend</title>
  </head>
  <body>
    <h1 class="verbe">Verbe</h1>
    <input type="text" class="input" />
    <div class="btn">
      <button class="submit_btn">Submit</button>
      <button class="refresh_btn">Next ></button>
    </div>

    <div class="min_range">
      <input
        type="range"
        name="min_range"
        class="min_range__input"
        step="5"
        min="0"
        max="60"
        value="0"
      /><span class="min_range__value">0</span>
    </div>
    <div class="max_range">
      <input
        type="range"
        class="max_range__input"
        step="5"
        min="1"
        max="62"
        value="61"
      /><span class="max_range__value">10</span>
    </div>
    <script src="app.js"></script>
  </body>
</html>
